<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실전 원어민 5단 롤플레이 회화 트레이너</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --cue-bg: #f8fafc;
      --hint-bg: #fffbeb;
      --hint-border: #fcd34d;
      --hint-text: #92400e;
      --ans-bg: #f0fdf4;
      --ans-border: #86efac;
      --highlight-bg: #fef08a;
      --highlight-text: #111827;
      --danger: #ef4444;
      --warn: #f59e0b;
      --good: #10b981;
      --easy: #3b82f6;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .title-wrap h1 {
      font-size: 1.25rem;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .title-wrap p {
      margin: 2px 0 0;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button:hover { background: #f8fafc; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: #1d4ed8; }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mode-tab {
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.84rem;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
    }

    .mode-tab.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: #bfdbfe;
      font-weight: 700;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    select {
      font-family: inherit;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.84rem;
      color: var(--text);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .meta-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #f1f5f9;
      color: #475569;
    }

    .badge-blue {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .star-btn {
      font-size: 1.15rem;
      padding: 4px 9px;
      border-radius: 8px;
      line-height: 1;
    }
    .star-btn.starred {
      color: #eab308;
      border-color: #fde047;
      background: #fefce8;
    }

    .section-box {
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .context-box {
      background: #f8fafc;
    }

    .place-tag {
      display: inline-block;
      background: #e2e8f0;
      color: #1e293b;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 6px;
    }

    .context-text {
      font-size: 0.96rem;
      color: #1e293b;
      margin: 0;
    }

    .cue-box {
      background: var(--primary-soft);
      border-color: #bfdbfe;
    }

    .cue-text {
      font-size: 1.12rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
    }

    .hint-box {
      background: var(--hint-bg);
      border-color: var(--hint-border);
    }

    .hint-box .section-label {
      color: var(--hint-text);
    }

    .hint-text {
      font-size: 0.98rem;
      font-weight: 700;
      color: #78350f;
      margin: 0;
    }

    .reveal-wrap {
      margin: 16px 0 4px;
      text-align: center;
    }

    .reveal-btn {
      width: 100%;
      padding: 13px 16px;
      font-size: 1rem;
      border-radius: 12px;
    }

    .answer-box {
      background: var(--ans-bg);
      border-color: var(--ans-border);
      margin-top: 14px;
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .answer-en {
      font-size: 1.16rem;
      font-weight: 700;
      color: #064e3b;
      margin: 4px 0 6px;
    }

    .chunk-highlight {
      background: var(--highlight-bg);
      color: var(--highlight-text);
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 5px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .answer-ko {
      font-size: 0.94rem;
      color: #166534;
      margin: 0 0 10px;
    }

    .core-phrase-meta {
      font-size: 0.83rem;
      color: #15803d;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .srs-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .srs-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 9px 6px;
      border-radius: 11px;
      font-size: 0.85rem;
      font-weight: 700;
      border-width: 1.5px;
    }

    .srs-btn small {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
    }

    .srs-again { border-color: #fecaca; color: #b91c1c; background: #fef2f2; }
    .srs-hard  { border-color: #fde68a; color: #b45309; background: #fffbeb; }
    .srs-good  { border-color: #a7f3d0; color: #047857; background: #ecfdf5; }
    .srs-easy  { border-color: #bfdbfe; color: #1d4ed8; background: #eff6ff; }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .audio-btn {
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
      background: #fff;
    }

    .status-bar {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);
    }

    .modal h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .modal p { margin: 0 0 12px; font-size: 0.85rem; color: var(--muted); }
    .modal input {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.88rem;
      margin-bottom: 12px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-wrap">
        <h1>🎙️ 실전 원어민 5단 롤플레이</h1>
        <p id="progressSummary">데이터 불러오는 중...</p>
      </div>
      <div class="header-actions">
        <button id="reloadBtn" type="button" title="시트 새로고침">🔄 새로고침</button>
        <button id="settingsBtn" type="button">⚙️ 연결 설정</button>
      </div>
    </header>

    <div class="controls-bar">
      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="due" type="button">📅 오늘 복습</button>
        <button class="mode-tab" data-mode="all" type="button">📚 전체 학습</button>
        <button class="mode-tab" data-mode="random" type="button">🎲 랜덤 훈련</button>
        <button class="mode-tab" data-mode="starred" type="button">⭐ 즐겨찾기</button>
      </div>
      <div class="filter-group">
        <select id="categorySelect">
          <option value="ALL">전체 카테고리</option>
        </select>
        <label class="toggle-label">
          <input type="checkbox" id="autoPlayCueChk" checked />
          CUE 자동재생
        </label>
      </div>
    </div>

    <main id="cardArea" class="card">
      <div class="status-bar">스프레드시트 데이터를 불러오고 있습니다...</div>
    </main>

    <div class="status-bar" id="audioStatus">
      단축키: [Space] 정답 보기 · [R] 상대 대사 듣기 · [A] 모범 응답 듣기 · [1~4] SRS 평가
    </div>
  </div>

  <!-- Apps Script Web App URL 설정 모달 -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h3>Apps Script 웹 앱 연결 설정</h3>
      <p>Google Apps Script에서 배포한 웹 앱 URL(<code>.../exec</code>)을 입력하세요.</p>
      <input type="url" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec" />
      <div class="modal-actions">
        <button type="button" id="closeModalBtn">취소</button>
        <button type="button" class="btn-primary" id="saveApiUrlBtn">저장 및 불러오기</button>
      </div>
    </div>
  </div>

  <script>
    // 본인의 Apps Script 배포 URL을 아래에 직접 넣어두면 기기 변경 시에도 바로 연결됩니다.
    const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwU58pr4pQPWxYFPPSuQeRMdFObrYg6B6vWt6epazyczJixpkd8eSVUyn4yEdjbW6oC/exec';
    const API_URL_STORAGE_KEY = 'ROLEPLAY_WEBAPP_EXEC_URL';
    const AUDIO_DB_NAME = 'RoleplayAudioCacheDB_v2';
    const AUDIO_STORE_NAME = 'wavCache';

    let allItems = [];
    let filteredQueue = [];
    let currentIndex = 0;
    let currentMode = 'due';
    let currentCategory = 'ALL';
    let currentTrigger = null;
    let lastTriggerIndex = -1;
    let isAnswerRevealed = false;
    let currentAudioEl = null;

    function getApiUrl() {
      const saved = localStorage.getItem(API_URL_STORAGE_KEY);
      if (saved && saved.trim()) return saved.trim();
      if (DEFAULT_API_URL && DEFAULT_API_URL.trim()) return DEFAULT_API_URL.trim();
      if (window.location.hostname.includes('script.google.com') || window.location.hostname.includes('googleusercontent.com')) {
        return window.location.href.split('?')[0];
      }
      return '';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /**
     * 모범 영어 응답 문장 안에서 핵심 청크(chunk)만 노란색 볼드 하이라이트 처리
     */
    function formatHighlightedAnswer(sentence, chunk) {
      const safeSentence = escapeHtml(sentence);
      const cleanChunk = String(chunk || '').replace(/[.?!,]+$/g, '').trim();
      if (!cleanChunk) return safeSentence;

      const pattern = new RegExp(`(${escapeRegExp(escapeHtml(cleanChunk))})`, 'gi');
      return safeSentence.replace(pattern, '<mark class="chunk-highlight">$1</mark>');
    }

    /**
     * 상황 배경 앞부분의 [장소 / 대화 상대] 태그 분리 렌더링
     */
    function formatContextHtml(contextStr) {
      const raw = String(contextStr || '').trim();
      const match = /^\[([^\]]+)\]\s*(.*)$/.exec(raw);
      if (match) {
        return `<span class="place-tag">${escapeHtml(match[1])}</span>${escapeHtml(match[2])}`;
      }
      return escapeHtml(raw);
    }

    /**
     * 5단 트리거 파싱:
     * segments[0]: 상황 배경 (Context)
     * segments[1]: 상대방 대사 (CUE)
     * segments[2]: 내 반응 힌트 (Response Intent Hint)
     * segments[3]: 모범 영어 응답 (Model Response)
     * segments[4]: 한국어 해석 (Translation)
     */
    function parseTriggerItem(rawSegment, item) {
      const segments = rawSegment.split('::').map(s => s.trim());
      if (segments.length >= 5) {
        return {
          context: segments[0],
          cue: segments[1],
          hint: segments[2],
          modelResponse: segments[3],
          translation: segments[4]
        };
      }
      if (segments.length === 4) {
        return {
          context: segments[0],
          cue: segments[1],
          hint: '',
          modelResponse: segments[2],
          translation: segments[3]
        };
      }
      return {
        context: segments[0] || '',
        cue: segments[1] || '',
        hint: '',
        modelResponse: item.english,
        translation: item.korean
      };
    }

    function pickRandomTrigger(item, excludeIdx = -1) {
      const rawTriggers = String(item.triggers || '').trim();
      if (!rawTriggers) {
        return {
          index: 0,
          total: 1,
          context: '기본 핵심 표현 연습',
          cue: '',
          hint: `핵심 표현 "${item.korean}"의 뉘앙스를 살려 영어로 말하기`,
          modelResponse: item.english,
          translation: item.korean
        };
      }

      const list = rawTriggers.split('|').map(s => s.trim()).filter(Boolean);
      let chosenIdx = Math.floor(Math.random() * list.length);
      if (list.length > 1 && chosenIdx === excludeIdx) {
        chosenIdx = (chosenIdx + 1) % list.length;
      }

      const parsed = parseTriggerItem(list[chosenIdx], item);
      return {
        index: chosenIdx,
        total: list.length,
        ...parsed
      };
    }

    // --- IndexedDB Audio Cache ---
    function openAudioDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(AUDIO_DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(AUDIO_STORE_NAME)) {
            db.createObjectStore(AUDIO_STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getCachedAudioBase64(text) {
      try {
        const db = await openAudioDb();
        return await new Promise((resolve) => {
          const tx = db.transaction(AUDIO_STORE_NAME, 'readonly');
          const store = tx.objectStore(AUDIO_STORE_NAME);
          const req = store.get(text);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function setCachedAudioBase64(text, audioObj) {
      try {
        const db = await openAudioDb();
        await new Promise((resolve) => {
          const tx = db.transaction(AUDIO_STORE_NAME, 'readwrite');
          tx.objectStore(AUDIO_STORE_NAME).put(audioObj, text);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch (e) {
        // ignore storage quota errors
      }
    }

    function stopCurrentAudio() {
      if (currentAudioEl) {
        currentAudioEl.pause();
        currentAudioEl.src = '';
        currentAudioEl = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function speakFallbackWebSpeech(text) {
      if (!('speechSynthesis' in window)) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.96;
      window.speechSynthesis.speak(utter);
    }

    async function playTts(rawText, label = '') {
      const text = String(rawText || '').replace(/^["“'‘]+|["”'’]+$/g, '').trim();
      if (!text) return;

      stopCurrentAudio();
      const statusEl = document.getElementById('audioStatus');
      if (statusEl) statusEl.textContent = `🔊 ${label || '음성'} 재생 준비 중...`;

      let audioData = await getCachedAudioBase64(text);

      if (!audioData) {
        const apiUrl = getApiUrl();
        if (apiUrl) {
          try {
            const resp = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'tts', text })
            });
            const json = await resp.json();
            if (json.status === 'ok' && json.audio && json.audio.base64) {
              audioData = json.audio;
              await setCachedAudioBase64(text, audioData);
            }
          } catch (err) {
            console.warn('TTS API 호출 실패, 브라우저 음성으로 전환:', err);
          }
        }
      }

      if (audioData && audioData.base64) {
        const dataUrl = `data:${audioData.mimeType || 'audio/wav'};base64,${audioData.base64}`;
        const audio = new Audio(dataUrl);
        currentAudioEl = audio;
        audio.onended = () => {
          if (statusEl) statusEl.textContent = '단축키: [Space] 정답 보기 · [R] 상대 대사 듣기 · [A] 모범 응답 듣기 · [1~4] SRS 평가';
        };
        try {
          await audio.play();
          if (statusEl) statusEl.textContent = `🔊 재생 중: "${text}"`;
          return;
        } catch (playErr) {
          console.warn('Audio play blocked:', playErr);
        }
      }

      speakFallbackWebSpeech(text);
      if (statusEl) statusEl.textContent = `🗣️ 기본 음성 재생: "${text}"`;
    }

    // --- Data & Queue Management ---
    function getTodayStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function populateCategories() {
      const sel = document.getElementById('categorySelect');
      const cats = Array.from(new Set(allItems.map(i => i.category).filter(Boolean)));
      sel.innerHTML = '<option value="ALL">전체 카테고리</option>' +
        cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      sel.value = currentCategory;
    }

    function rebuildQueue(resetIndex = true) {
      const today = getTodayStr();
      let list = allItems.filter(item => currentCategory === 'ALL' || item.category === currentCategory);

      if (currentMode === 'due') {
        list = list.filter(item => !item.due || item.due <= today);
      } else if (currentMode === 'starred') {
        list = list.filter(item => item.starred);
      } else if (currentMode === 'random') {
        list = [...list].sort(() => Math.random() - 0.5);
      }

      filteredQueue = list;
      if (resetIndex) currentIndex = 0;
      if (currentIndex >= filteredQueue.length) currentIndex = 0;

      updateSummary();
      renderCurrentCard(true);
    }

    function updateSummary() {
      const today = getTodayStr();
      const dueCount = allItems.filter(i => !i.due || i.due <= today).length;
      const starCount = allItems.filter(i => i.starred).length;
      document.getElementById('progressSummary').textContent =
        `전체 ${allItems.length}개 · 오늘 복습 ${dueCount}개 · ⭐ ${starCount}개`;
    }

    function renderCurrentCard(autoPlayCue = false) {
      const cardArea = document.getElementById('cardArea');
      if (!filteredQueue.length) {
        cardArea.innerHTML = `
          <div style="text-align:center; padding: 28px 12px;">
            <div style="font-size:2rem; margin-bottom:8px;">🎉</div>
            <h3 style="margin:0 0 6px;">현재 조건의 학습 카드가 모두 완료되었습니다!</h3>
            <p style="margin:0 0 16px; color:var(--muted); font-size:0.9rem;">
              상단 탭에서 <strong>전체 학습</strong>이나 <strong>랜덤 훈련</strong>으로 전환해 계속 연습할 수 있습니다.
            </p>
            <button type="button" class="btn-primary" onclick="switchMode('all')">전체 학습으로 전환</button>
          </div>
        `;
        return;
      }

      const item = filteredQueue[currentIndex];
      currentTrigger = pickRandomTrigger(item, -1);
      lastTriggerIndex = currentTrigger.index;
      isAnswerRevealed = false;

      renderCardHtml(item, currentTrigger, false);

      if (autoPlayCue && document.getElementById('autoPlayCueChk').checked && currentTrigger.cue) {
        playTts(currentTrigger.cue, '상대방 대사(CUE)');
      }
    }

    function renderCardHtml(item, trig, revealed) {
      const cardArea = document.getElementById('cardArea');
      const highlightedAnswerHtml = formatHighlightedAnswer(trig.modelResponse, item.chunk);

      cardArea.innerHTML = `
        <div class="card-top">
          <div class="meta-badges">
            <span class="badge badge-blue">#${escapeHtml(item.id)} (${currentIndex + 1} / ${filteredQueue.length})</span>
            ${item.category ? `<span class="badge">${escapeHtml(item.category)}</span>` : ''}
            <span class="badge">상황 ${trig.index + 1}/${trig.total}</span>
            <span class="badge">복습 ${item.count}회</span>
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            <button type="button" id="swapTriggerBtn" title="같은 표현의 다른 상황 보기">🔀 다른 상황</button>
            <button type="button" id="starBtn" class="star-btn ${item.starred ? 'starred' : ''}" title="즐겨찾기">
              ${item.starred ? '★' : '☆'}
            </button>
          </div>
        </div>

        <!-- 1. 상황 배경 -->
        <div class="section-box context-box">
          <div class="section-label">
            <span>📍 1. 상황 배경</span>
          </div>
          <p class="context-text">${formatContextHtml(trig.context)}</p>
        </div>

        <!-- 2. 상대방 대사 (CUE) -->
        ${trig.cue ? `
        <div class="section-box cue-box">
          <div class="section-label">
            <span>💬 2. 상대방 대사 (CUE)</span>
            <button type="button" class="audio-btn" id="playCueBtn">🔊 대사 듣기 (R)</button>
          </div>
          <p class="cue-text">"${escapeHtml(trig.cue)}"</p>
        </div>` : ''}

        <!-- 3. 내 반응 힌트 (발화 의도) -->
        ${trig.hint ? `
        <div class="section-box hint-box">
          <div class="section-label">
            <span>🎯 3. 내 반응 힌트 (영어로 먼저 말해 보세요!)</span>
          </div>
          <p class="hint-text">${escapeHtml(trig.hint)}</p>
        </div>` : ''}

        ${!revealed ? `
          <div class="reveal-wrap">
            <button type="button" class="btn-primary reveal-btn" id="revealBtn">
              👀 모범 응답 및 해석 확인 (Space)
            </button>
          </div>
        ` : `
          <!-- 4 & 5. 모범 영어 응답 + 한국어 해석 -->
          <div class="section-box answer-box">
            <div class="section-label">
              <span>✅ 4. 모범 영어 응답 (핵심 청크 강조)</span>
              <button type="button" class="audio-btn" id="playAnswerBtn">🔊 응답 발음 (A)</button>
            </div>
            <div class="answer-en">"${highlightedAnswerHtml}"</div>
            <p class="answer-ko">${escapeHtml(trig.translation)}</p>
            <div class="core-phrase-meta">
              <span>핵심 청크: <strong>${escapeHtml(item.chunk)}</strong> (${escapeHtml(item.korean)})</span>
              <button type="button" class="audio-btn" id="playChunkBtn">🔊 청크만 듣기</button>
            </div>
          </div>

          <div class="srs-bar">
            <button type="button" class="srs-btn srs-again" data-grade="1">1. 다시<small>오늘 재복습</small></button>
            <button type="button" class="srs-btn srs-hard" data-grade="2">2. 어려움<small>${calcNextInterval(item, 2)}일 뒤</small></button>
            <button type="button" class="srs-btn srs-good" data-grade="3">3. 알맞음<small>${calcNextInterval(item, 3)}일 뒤</small></button>
            <button type="button" class="srs-btn srs-easy" data-grade="4">4. 쉬움<small>${calcNextInterval(item, 4)}일 뒤</small></button>
          </div>
        `}

        <div class="nav-footer">
          <button type="button" id="prevCardBtn" ${currentIndex === 0 ? 'disabled' : ''}>← 이전 카드</button>
          <button type="button" id="nextCardBtn">다음 카드 →</button>
        </div>
      `;

      // 이벤트 바인딩
      document.getElementById('swapTriggerBtn').onclick = () => {
        currentTrigger = pickRandomTrigger(item, lastTriggerIndex);
        lastTriggerIndex = currentTrigger.index;
        isAnswerRevealed = false;
        renderCardHtml(item, currentTrigger, false);
        if (document.getElementById('autoPlayCueChk').checked && currentTrigger.cue) {
          playTts(currentTrigger.cue, '상대방 대사(CUE)');
        }
      };

      document.getElementById('starBtn').onclick = () => toggleStar(item);

      const playCueBtn = document.getElementById('playCueBtn');
      if (playCueBtn) {
        playCueBtn.onclick = () => playTts(trig.cue, '상대방 대사(CUE)');
      }

      const revealBtn = document.getElementById('revealBtn');
      if (revealBtn) {
        revealBtn.onclick = () => {
          isAnswerRevealed = true;
          renderCardHtml(item, trig, true);
          playTts(trig.modelResponse, '모범 영어 응답');
        };
      }

      const playAnswerBtn = document.getElementById('playAnswerBtn');
      if (playAnswerBtn) {
        playAnswerBtn.onclick = () => playTts(trig.modelResponse, '모범 영어 응답');
      }

      const playChunkBtn = document.getElementById('playChunkBtn');
      if (playChunkBtn) {
        playChunkBtn.onclick = () => playTts(item.english, '핵심 표현');
      }

      document.querySelectorAll('.srs-btn').forEach(btn => {
        btn.onclick = () => handleSrsGrade(item, Number(btn.dataset.grade));
      });

      document.getElementById('prevCardBtn').onclick = () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderCurrentCard(true);
        }
      };

      document.getElementById('nextCardBtn').onclick = () => {
        if (currentIndex < filteredQueue.length - 1) {
          currentIndex++;
        } else {
          currentIndex = 0;
        }
        renderCurrentCard(true);
      };
    }

    function calcNextInterval(item, grade) {
      const prevInterval = Number(item.interval) || 0;
      const ease = Number(item.ease) || 2.5;
      if (grade === 1) return 0;
      if (grade === 2) return Math.max(1, Math.round(prevInterval * 1.2) || 1);
      if (grade === 3) return prevInterval === 0 ? 1 : (prevInterval === 1 ? 3 : Math.round(prevInterval * ease));
      return prevInterval === 0 ? 4 : Math.round(prevInterval * ease * 1.3);
    }

    function addDaysStr(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    async function handleSrsGrade(item, grade) {
      const nextInterval = calcNextInterval(item, grade);
      let nextEase = Number(item.ease) || 2.5;
      if (grade === 1) nextEase = Math.max(1.3, nextEase - 0.2);
      else if (grade === 2) nextEase = Math.max(1.3, nextEase - 0.15);
      else if (grade === 4) nextEase = nextEase + 0.15;

      const nextDue = addDaysStr(nextInterval);
      item.interval = nextInterval;
      item.ease = Number(nextEase.toFixed(2));
      item.due = nextDue;
      item.count = (Number(item.count) || 0) + 1;

      updateSummary();

      const apiUrl = getApiUrl();
      if (apiUrl) {
        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'saveSrs',
            rowIndex: item.rowIndex,
            incrementCount: true,
            interval: item.interval,
            ease: item.ease,
            due: item.due
          })
        }).catch(err => console.warn('SRS 저장 오류:', err));
      }

      if (currentMode === 'due' && grade > 1) {
        filteredQueue.splice(currentIndex, 1);
        if (currentIndex >= filteredQueue.length) currentIndex = 0;
      } else {
        currentIndex = (currentIndex + 1) % Math.max(1, filteredQueue.length);
      }
      renderCurrentCard(true);
    }

    async function toggleStar(item) {
      item.starred = !item.starred;
      updateSummary();
      renderCardHtml(item, currentTrigger, isAnswerRevealed);

      const apiUrl = getApiUrl();
      if (apiUrl) {
        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'toggleStar',
            rowIndex: item.rowIndex
          })
        }).catch(err => console.warn('즐겨찾기 저장 오류:', err));
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.mode === mode);
      });
      rebuildQueue(true);
    }

    async function loadData() {
      const cardArea = document.getElementById('cardArea');
      const apiUrl = getApiUrl();
      if (!apiUrl) {
        cardArea.innerHTML = `
          <div style="text-align:center; padding: 28px 12px;">
            <h3 style="margin:0 0 8px;">Apps Script 웹 앱 URL 연결이 필요합니다</h3>
            <p style="margin:0 0 14px; color:var(--muted); font-size:0.9rem;">
              상단 <strong>⚙️ 연결 설정</strong> 버튼을 눌러 배포된 웹 앱 URL을 입력해 주세요.
            </p>
            <button type="button" class="btn-primary" onclick="openSettings()">⚙️ 웹 앱 URL 입력하기</button>
          </div>
        `;
        return;
      }

      cardArea.innerHTML = '<div class="status-bar">스프레드시트 데이터를 불러오는 중입니다...</div>';
      try {
        const resp = await fetch(apiUrl);
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        allItems = Array.isArray(data) ? data : [];
        populateCategories();
        rebuildQueue(true);
      } catch (err) {
        cardArea.innerHTML = `
          <div style="text-align:center; padding: 24px 12px; color:#b91c1c;">
            <strong>데이터 불러오기 실패:</strong> ${escapeHtml(err.message)}<br/>
            <small style="color:var(--muted);">웹 앱 배포 권한(모든 사용자) 및 URL을 확인해 주세요.</small>
          </div>
        `;
      }
    }

    function openSettings() {
      document.getElementById('apiUrlInput').value = getApiUrl();
      document.getElementById('settingsModal').classList.add('open');
    }

    // --- Event Listeners ---
    document.querySelectorAll('.mode-tab').forEach(btn => {
      btn.onclick = () => switchMode(btn.dataset.mode);
    });

    document.getElementById('categorySelect').onchange = (e) => {
      currentCategory = e.target.value;
      rebuildQueue(true);
    };

    document.getElementById('reloadBtn').onclick = () => loadData();
    document.getElementById('settingsBtn').onclick = () => openSettings();
    document.getElementById('closeModalBtn').onclick = () => {
      document.getElementById('settingsModal').classList.remove('open');
    };
    document.getElementById('saveApiUrlBtn').onclick = () => {
      const val = document.getElementById('apiUrlInput').value.trim();
      if (val) {
        localStorage.setItem(API_URL_STORAGE_KEY, val);
      }
      document.getElementById('settingsModal').classList.remove('open');
      loadData();
    };

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('settingsModal').classList.contains('open')) return;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

      if (e.code === 'Space') {
        e.preventDefault();
        const revealBtn = document.getElementById('revealBtn');
        if (revealBtn) revealBtn.click();
      } else if (e.key.toLowerCase() === 'r') {
        if (currentTrigger && currentTrigger.cue) playTts(currentTrigger.cue, '상대방 대사(CUE)');
      } else if (e.key.toLowerCase() === 'a') {
        if (isAnswerRevealed && currentTrigger) playTts(currentTrigger.modelResponse, '모범 영어 응답');
      } else if (['1', '2', '3', '4'].includes(e.key) && isAnswerRevealed) {
        const item = filteredQueue[currentIndex];
        if (item) handleSrsGrade(item, Number(e.key));
      }
    });

    loadData();
  </script>
</body>
</html>
