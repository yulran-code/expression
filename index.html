<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My PlayPhrase Trainer</title>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --text: #f5f5f5; --sub: #a0a0a0; --accent: #4f8cff; --star: #f5c518; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 680px; width: 100%; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .badge { background: #2c2c2c; padding: 6px 12px; border-radius: 20px; font-size: 13px; color: var(--sub); }
    .card { background: var(--card); border-radius: 16px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; margin-bottom: 16px; position: relative; }
    .star-btn { position: absolute; top: 18px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer; color: #555; }
    .star-btn.active { color: var(--star); }
    .korean { font-size: 20px; color: #ffd166; margin-bottom: 14px; font-weight: 600; }
    .english { font-size: 26px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
    .english.hidden { filter: blur(8px); cursor: pointer; user-select: none; }
    .chunk-tag { display: inline-block; background: #2a3441; color: #7bb0ff; padding: 4px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    button.action { padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn-playphrase { background: #e63946; color: white; }
    .btn-yarn { background: #2a9d8f; color: white; }
    .btn-tts { background: #333; color: white; }
    .btn-done { background: var(--accent); color: white; }
    .nav-bar { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .nav-bar button { flex: 1; padding: 12px; background: #252525; color: var(--text); border: 1px solid #333; border-radius: 10px; cursor: pointer; font-size: 14px; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .filter-bar button { padding: 6px 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: var(--sub); cursor: pointer; font-size: 13px; }
    .filter-bar button.active { background: var(--accent); color: white; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="filter-bar">
        <button id="filterAll" class="active" onclick="setFilter('all')">전체 문장</button>
        <button id="filterStar" onclick="setFilter('star')">★ 즐겨찾기만</button>
        <button id="toggleBlur" onclick="toggleHideEnglish()">영어 가리기 (출력훈련)</button>
      </div>
      <div class="badge" id="progressText">로딩 중...</div>
    </div>

    <div class="card">
      <button class="star-btn" id="starBtn" onclick="toggleStar()">★</button>
      <div class="korean" id="koreanText">데이터를 불러오는 중입니다...</div>
      <div class="english" id="englishText" onclick="this.classList.remove('hidden')">-</div>
      <div class="chunk-tag" id="chunkText">검색 청크: -</div>

      <div class="btn-group">
        <button class="action btn-playphrase" onclick="openVideo('playphrase')">🎬 PlayPhrase 영화씬</button>
        <button class="action btn-yarn" onclick="openVideo('yarn')">🎞️ Yarn 미드 클립</button>
        <button class="action btn-tts" onclick="speakTTS()">🔊 원어민 TTS 듣기</button>
        <button class="action btn-done" onclick="markPracticed()">✅ 1회 암기 완료 (+1)</button>
      </div>
    </div>

    <div class="nav-bar">
      <button onclick="prevCard()">← 이전 문장</button>
      <button onclick="randomCard()">🔀 랜덤 뽑기</button>
      <button onclick="nextCard()">다음 문장 →</button>
    </div>
  </div>

  <script>
    // ▼ 여기에 Google Apps Script 웹 앱 URL을 붙여넣으세요 ▼
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzbqNm4LYUM1-UFPsV9tKerp5egMZLLVNIh_RH0NBfHfcAnI5AL6_5Yrog1A54z3QDR/exec';

    let allPhrases = [];
    let filteredPhrases = [];
    let currentIndex = 0;
    let hideEnglish = false;
    let currentFilter = 'all';
    let videoPopup = null;

    async function loadData() {
      const res = await fetch(GAS_URL);
      allPhrases = await res.json();
      applyFilter();
    }

    function applyFilter() {
      filteredPhrases = currentFilter === 'star'
        ? allPhrases.filter(p => p.starred)
        : [...allPhrases];
      currentIndex = 0;
      renderCard();
    }

    function setFilter(type) {
      currentFilter = type;
      document.getElementById('filterAll').classList.toggle('active', type === 'all');
      document.getElementById('filterStar').classList.toggle('active', type === 'star');
      applyFilter();
    }

    function toggleHideEnglish() {
      hideEnglish = !hideEnglish;
      document.getElementById('toggleBlur').classList.toggle('active', hideEnglish);
      renderCard();
    }

    function renderCard() {
      if (filteredPhrases.length === 0) {
        document.getElementById('koreanText').innerText = '표시할 문장이 없습니다.';
        document.getElementById('englishText').innerText = '';
        return;
      }
      const item = filteredPhrases[currentIndex];
      document.getElementById('progressText').innerText = `${currentIndex + 1} / ${filteredPhrases.length} (누적 ${item.count}회)`;
      document.getElementById('koreanText').innerText = item.korean;
      const engEl = document.getElementById('englishText');
      engEl.innerText = item.english;
      engEl.classList.toggle('hidden', hideEnglish);
      document.getElementById('chunkText').innerText = `영상 검색 청크: "${item.chunk}"`;
      document.getElementById('starBtn').classList.toggle('active', item.starred);
    }

    function openVideo(service) {
      const item = filteredPhrases[currentIndex];
      const query = encodeURIComponent(item.chunk);
      const url = service === 'playphrase'
        ? `https://www.playphrase.me/#/search?q=${query}`
        : `https://getyarn.io/yarn-find?text=${query}`;

      // 동일한 팝업 창 이름으로 열어서 창이 계속 새로 쌓이지 않고 내용만 바뀌게 함
      videoPopup = window.open(url, 'PhraseVideoPlayer', 'width=850,height=650,left=720,top=50');
    }

    function speakTTS() {
      const item = filteredPhrases[currentIndex];
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(item.english);
      utter.lang = 'en-US';
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }

    async function markPracticed() {
      const item = filteredPhrases[currentIndex];
      item.count += 1;
      renderCard();
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'increment', rowIndex: item.rowIndex })
      });
      nextCard();
    }

    async function toggleStar() {
      const item = filteredPhrases[currentIndex];
      item.starred = !item.starred;
      renderCard();
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'toggleStar', rowIndex: item.rowIndex })
      });
    }

    function nextCard() {
      if (filteredPhrases.length === 0) return;
      currentIndex = (currentIndex + 1) % filteredPhrases.length;
      renderCard();
    }

    function prevCard() {
      if (filteredPhrases.length === 0) return;
      currentIndex = (currentIndex - 1 + filteredPhrases.length) % filteredPhrases.length;
      renderCard();
    }

    function randomCard() {
      if (filteredPhrases.length === 0) return;
      currentIndex = Math.floor(Math.random() * filteredPhrases.length);
      renderCard();
    }

    // 키보드 단축키 (좌/우 화살표, Space: TTS, Enter: PlayPhrase 열기)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === 'ArrowLeft') prevCard();
      if (e.code === 'Space') { e.preventDefault(); speakTTS(); }
      if (e.key === 'Enter') openVideo('playphrase');
    });

    loadData();
  </script>
</body>
</html>
