<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Trigger Roleplay Trainer</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --box: #262626;
      --text: #f5f5f5;
      --sub: #a8a8a8;
      --accent: #4f8cff;
      --gold: #ffd166;
      --star: #f5c518;
      --ok: #2ec4b6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 720px;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid #333;
      background: var(--card);
      color: var(--sub);
      font-size: 13px;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    .badge {
      background: var(--card);
      border: 1px solid #2e2e2e;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--sub);
    }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      position: relative;
      margin-bottom: 14px;
    }
    .star-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      font-size: 26px;
      color: #555;
      cursor: pointer;
    }
    .star-btn.active {
      color: var(--star);
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .cat-tag {
      background: #2b2d42;
      color: #c7d2fe;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .chunk-tag {
      background: #1d3557;
      color: #90e0ef;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .trigger-box {
      background: var(--box);
      border-left: 4px solid var(--gold);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .context-label {
      font-size: 12px;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    .context-text {
      font-size: 15px;
      line-height: 1.5;
      color: #e5e5e5;
      margin-bottom: 14px;
    }
    .cue-label {
      font-size: 12px;
      color: var(--ok);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .cue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cue-text {
      font-size: 19px;
      font-weight: 600;
      color: #fff;
      line-height: 1.45;
    }
    .mini-btn {
      background: #343434;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .mini-btn:hover { background: #444; }
    .speak-prompt {
      text-align: center;
      padding: 16px;
      border: 1px dashed #444;
      border-radius: 12px;
      color: var(--sub);
      font-size: 15px;
      margin-bottom: 16px;
    }
    .speak-prompt strong {
      color: #fff;
      display: block;
      font-size: 17px;
      margin-bottom: 4px;
    }
    .answer-box {
      display: none;
      background: #17222b;
      border: 1px solid #2b4c65;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .answer-box.revealed {
      display: block;
    }
    .answer-english {
      font-size: 25px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .answer-english.masked {
      filter: blur(8px);
      cursor: pointer;
    }
    .answer-korean {
      font-size: 17px;
      color: var(--gold);
      margin-bottom: 16px;
    }
    .video-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      border: none;
      border-radius: 11px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.99); }
    .btn-reveal {
      width: 100%;
      background: var(--accent);
      color: #fff;
      margin-bottom: 10px;
    }
    .btn-reroll {
      width: 100%;
      background: #2c2c2c;
      color: #ddd;
    }
    .btn-playphrase {
      background: #e63946;
      color: #fff;
    }
    .btn-yarn {
      background: #2a9d8f;
      color: #fff;
    }
    .btn-tts {
      background: #333;
      color: #fff;
    }
    .btn-done {
      background: #3a86ff;
      color: #fff;
    }
    .post-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .nav-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid #2f2f2f;
      border-radius: 11px;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .shortcut-hint {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="filter-group">
        <button id="fAll" class="chip active" onclick="setFilter('all')">전체 문장</button>
        <button id="fStar" class="chip" onclick="setFilter('star')">★ 즐겨찾기</button>
        <button id="fMask" class="chip" onclick="toggleMask()">정답 영어 가리기</button>
      </div>
      <div class="badge" id="statusBadge">불러오는 중...</div>
    </div>

    <div class="card">
      <button class="star-btn" id="starBtn" onclick="toggleStar()" title="즐겨찾기">★</button>

      <div class="meta-row">
        <span class="cat-tag" id="categoryTag">카테고리</span>
        <span class="chunk-tag" id="chunkTag">검색 청크: -</span>
      </div>

      <!-- 1단계: 랜덤 상황 지문 & 상대방 대사 -->
      <div class="trigger-box">
        <div class="context-label">📍 랜덤 상황 지문</div>
        <div class="context-text" id="contextText">상황을 불러오는 중입니다...</div>

        <div class="cue-label">💬 상대방 대사 (Cue)</div>
        <div class="cue-row">
          <div class="cue-text" id="cueText">-</div>
          <button class="mini-btn" onclick="speakText(currentTrigger.cue)">🔊 상대 대사 듣기</button>
        </div>
      </div>

      <!-- 2단계: 반사 발화 유도 영역 -->
      <div class="speak-prompt" id="speakPrompt">
        <strong>🎙️ 지금 상황을 떠올리며 영어로 반사 발화해 보세요!</strong>
        머릿속 번역보다 상황 느낌대로 먼저 입 밖으로 꺼낸 뒤 정답을 확인하세요.
      </div>

      <button class="btn btn-reveal" id="revealBtn" onclick="revealAnswer()">
        정답 문장 & 영화/미드 클립 띄우기
      </button>
      <button class="btn btn-reroll" onclick="rerollTrigger()">
        🎲 같은 문장의 다른 상황 랜덤 뽑기
      </button>

      <!-- 3단계: 정답 공개 + PlayPhrase / Yarn 버튼 -->
      <div class="answer-box" id="answerBox">
        <div class="answer-english" id="answerEnglish" onclick="this.classList.remove('masked')">-</div>
        <div class="answer-korean" id="answerKorean">-</div>

        <div class="video-actions">
          <button class="btn btn-playphrase" onclick="openScene('playphrase')">🎬 PlayPhrase 영화씬</button>
          <button class="btn btn-yarn" onclick="openScene('yarn')">🎞️ Yarn 미드 클립</button>
        </div>

        <div class="post-grid">
          <button class="btn btn-tts" onclick="speakText(currentItem.english)">🔊 내 정답 발음 듣기</button>
          <button class="btn btn-done" onclick="completeAndNext()">✅ 1회 완료 & 다음 문장</button>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" onclick="prevItem()">← 이전 문장</button>
      <button class="nav-btn" onclick="randomItem()">🔀 랜덤 문장</button>
      <button class="nav-btn" onclick="nextItem()">다음 문장 →</button>
    </div>

    <div class="shortcut-hint">
      단축키: <b>Space</b> 정답 공개/정답 발음 · <b>Enter</b> PlayPhrase 열기 · <b>R</b> 다른 상황 뽑기 · <b>← / →</b> 문장 이동
    </div>
  </div>

  <script>
    // ▼ 여기에 Google Apps Script 웹 앱 URL을 붙여넣으세요 ▼
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwU58pr4pQPWxYFPPSuQeRMdFObrYg6B6vWt6epazyczJixpkd8eSVUyn4yEdjbW6oC/exec';

    let phrases = [];
    let filtered = [];
    let currentIndex = 0;
    let currentItem = null;
    let currentTrigger = { context: '', cue: '' };
    let isRevealed = false;
    let isMasked = false;
    let filterMode = 'all';

    async function init() {
      try {
        const res = await fetch(GAS_URL);
        phrases = await res.json();
        applyFilter();
      } catch (err) {
        document.getElementById('contextText').innerText =
          '스프레드시트 데이터를 불러오지 못했습니다. GAS_URL 설정과 웹 앱 배포 권한을 확인해 주세요.';
      }
    }

    function setFilter(mode) {
      filterMode = mode;
      document.getElementById('fAll').classList.toggle('active', mode === 'all');
      document.getElementById('fStar').classList.toggle('active', mode === 'star');
      applyFilter();
    }

    function toggleMask() {
      isMasked = !isMasked;
      document.getElementById('fMask').classList.toggle('active', isMasked);
      const engEl = document.getElementById('answerEnglish');
      engEl.classList.toggle('masked', isMasked);
    }

    function applyFilter() {
      filtered = filterMode === 'star'
        ? phrases.filter(p => p.starred)
        : [...phrases];
      currentIndex = 0;
      loadItem(0);
    }

    function pickRandomTrigger(triggersRaw) {
      if (!triggersRaw) {
        return { context: '자연스러운 일상 대화 상황', cue: 'How\'s it going?' };
      }
      const candidates = String(triggersRaw)
        .split('|')
        .map(s => s.trim())
        .filter(Boolean);

      const chosen = candidates[Math.floor(Math.random() * candidates.length)] || '';
      const parts = chosen.split('::');
      return {
        context: (parts[0] || '일상 대화 상황').trim(),
        cue: (parts[1] || '').replace(/^"+|"+$/g, '').trim()
      };
    }

    function loadItem(idx) {
      if (filtered.length === 0) {
        currentItem = null;
        document.getElementById('contextText').innerText = '표시할 문장이 없습니다.';
        document.getElementById('cueText').innerText = '-';
        document.getElementById('statusBadge').innerText = '0 / 0';
        return;
      }

      currentIndex = ((idx % filtered.length) + filtered.length) % filtered.length;
      currentItem = filtered[currentIndex];
      isRevealed = false;

      document.getElementById('answerBox').classList.remove('revealed');
      document.getElementById('revealBtn').style.display = 'block';
      document.getElementById('speakPrompt').style.display = 'block';

      document.getElementById('statusBadge').innerText =
        `${currentIndex + 1} / ${filtered.length} (누적 ${currentItem.count || 0}회)`;
      document.getElementById('categoryTag').innerText = currentItem.category || '일반';
      document.getElementById('chunkTag').innerText = `검색 청크: ${currentItem.chunk || currentItem.english}`;
      document.getElementById('starBtn').classList.toggle('active', Boolean(currentItem.starred));

      document.getElementById('answerEnglish').innerText = currentItem.english;
      document.getElementById('answerEnglish').classList.toggle('masked', isMasked);
      document.getElementById('answerKorean').innerText = currentItem.korean;

      rerollTrigger();
    }

    function rerollTrigger() {
      if (!currentItem) return;
      currentTrigger = pickRandomTrigger(currentItem.triggers);
      document.getElementById('contextText').innerText = currentTrigger.context;
      document.getElementById('cueText').innerText =
        currentTrigger.cue ? `"${currentTrigger.cue}"` : '(상황 지문을 보고 자연스럽게 반응해 보세요)';
    }

    function revealAnswer() {
      if (!currentItem) return;
      isRevealed = true;
      document.getElementById('answerBox').classList.add('revealed');
      document.getElementById('revealBtn').style.display = 'none';
      document.getElementById('speakPrompt').style.display = 'none';
      speakText(currentItem.english);
    }

    function speakText(text) {
      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }

    function openScene(platform) {
      if (!currentItem) return;
      const query = encodeURIComponent(currentItem.chunk || currentItem.english);
      const url = platform === 'playphrase'
        ? `https://www.playphrase.me/#/search?q=${query}`
        : `https://getyarn.io/yarn-find?text=${query}`;

      window.open(url, 'PhraseSceneWindow', 'width=860,height=660,left=720,top=50');
    }

    async function completeAndNext() {
      if (!currentItem) return;
      currentItem.count = (Number(currentItem.count) || 0) + 1;
      const targetRow = currentItem.rowIndex;

      nextItem();

      if (GAS_URL && !GAS_URL.includes('여기에_배포된_웹앱_URL') && targetRow) {
        fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'increment', rowIndex: targetRow })
        }).catch(() => {});
      }
    }

    async function toggleStar() {
      if (!currentItem) return;
      currentItem.starred = !currentItem.starred;
      document.getElementById('starBtn').classList.toggle('active', currentItem.starred);

      if (GAS_URL && !GAS_URL.includes('여기에_배포된_웹앱_URL') && currentItem.rowIndex) {
        fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'toggleStar', rowIndex: currentItem.rowIndex })
        }).catch(() => {});
      }
    }

    function nextItem() {
      loadItem(currentIndex + 1);
    }

    function prevItem() {
      loadItem(currentIndex - 1);
    }

    function randomItem() {
      if (filtered.length <= 1) return;
      let nextIdx = currentIndex;
      while (nextIdx === currentIndex) {
        nextIdx = Math.floor(Math.random() * filtered.length);
      }
      loadItem(nextIdx);
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isRevealed) revealAnswer();
        else speakText(currentItem?.english);
      } else if (e.key === 'Enter') {
        if (!isRevealed) revealAnswer();
        else openScene('playphrase');
      } else if (e.key === 'r' || e.key === 'R') {
        rerollTrigger();
      } else if (e.key === 'ArrowRight') {
        nextItem();
      } else if (e.key === 'ArrowLeft') {
        prevItem();
      }
    });

    init();
  </script>
</body>
</html>
