<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet-Synced SRS Trigger Trainer</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --box: #262626;
      --text: #f5f5f5;
      --sub: #a8a8a8;
      --accent: #4f8cff;
      --gold: #ffd166;
      --star: #f5c518;
      --ok: #2ec4b6;
      --warn: #ff7b54;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .app { width: 100%; max-width: 740px; }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid #333;
      background: var(--card);
      color: var(--sub);
      font-size: 13px;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    .badge {
      background: var(--card);
      border: 1px solid #2e2e2e;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--sub);
    }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      margin-bottom: 12px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }
    .star-btn {
      background: #282828;
      border: 1px solid #383838;
      border-radius: 10px;
      width: 38px;
      height: 38px;
      font-size: 20px;
      color: #666;
      cursor: pointer;
      flex-shrink: 0;
    }
    .star-btn.active { color: var(--star); border-color: #66581c; }
    .tag {
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 8px;
      background: #2b2d42;
      color: #c7d2fe;
    }
    .tag.chunk { background: #1d3557; color: #90e0ef; }
    .tag.srs { background: #263238; color: #80cbc4; }
    .trigger-box {
      background: var(--box);
      border-left: 4px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .context-label { font-size: 12px; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
    .context-text { font-size: 16px; line-height: 1.55; color: #f0f0f0; margin-bottom: 14px; }
    .cue-section { border-top: 1px solid #353535; padding-top: 12px; }
    .cue-label { font-size: 12px; color: var(--ok); font-weight: 700; margin-bottom: 8px; }
    .cue-hidden-note { font-size: 13px; color: var(--sub); margin-bottom: 10px; }
    .cue-text {
      display: none;
      font-size: 19px;
      font-weight: 600;
      color: #fff;
      line-height: 1.45;
      word-break: keep-all;
      margin-bottom: 12px;
    }
    .cue-text.revealed { display: block; }
    .cue-btn {
      width: 100%;
      background: #2e3b4e;
      color: #fff;
      border: 1px solid #486080;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .hint-box {
      display: none;
      background: #222831;
      border: 1px solid #394867;
      color: #a5d8ff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .hint-box.show { display: block; }
    .speak-prompt {
      text-align: center;
      padding: 14px;
      border: 1px dashed #444;
      border-radius: 12px;
      color: var(--sub);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .speak-prompt strong { color: #fff; display: block; font-size: 15px; margin-bottom: 4px; }
    .btn {
      border: none;
      border-radius: 11px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .pre-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-bottom: 10px; }
    .btn-reveal { background: var(--accent); color: #fff; width: 100%; }
    .btn-hint { background: #2f3640; color: #ffd166; width: 100%; }
    .btn-reroll { width: 100%; background: #2c2c2c; color: #ddd; }
    .answer-box {
      display: none;
      background: #17222b;
      border: 1px solid #2b4c65;
      border-radius: 14px;
      padding: 18px;
      margin-top: 10px;
      text-align: center;
    }
    .answer-box.revealed { display: block; }
    .answer-english { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.35; }
    .answer-english.masked { filter: blur(8px); cursor: pointer; }
    .answer-korean { font-size: 16px; color: var(--gold); margin-bottom: 14px; }
    .video-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-playphrase { background: #e63946; color: #fff; }
    .btn-yarn { background: #2a9d8f; color: #fff; }
    .srs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn-again { background: var(--warn); color: #fff; padding: 11px 8px; }
    .btn-good { background: #2a9d8f; color: #fff; padding: 11px 8px; }
    .btn-easy { background: #3a86ff; color: #fff; padding: 11px 8px; }
    .nav-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .nav-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid #2f2f2f;
      border-radius: 11px;
      padding: 12px 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="filter-group">
        <button id="fDue" class="chip active" onclick="setMode('due')">오늘 복습/신규 (시트동기화)</button>
        <button id="fSession15" class="chip" onclick="setMode('session15')">오늘 집중 15개</button>
        <button id="fStar" class="chip" onclick="setMode('star')">★ 즐겨찾기</button>
        <button id="fAll" class="chip" onclick="setMode('all')">전체 보기</button>
        <button id="fMask" class="chip" onclick="toggleMask()">정답 가리기</button>
      </div>
      <div class="badge" id="statusBadge">불러오는 중...</div>
    </div>

    <div class="card">
      <div class="card-top">
        <div class="meta-row">
          <span class="tag" id="categoryTag">카테고리</span>
          <span class="tag chunk" id="chunkTag">청크: -</span>
          <span class="tag srs" id="srsTag">SRS: 신규</span>
        </div>
        <button class="star-btn" id="starBtn" onclick="toggleStar()" title="즐겨찾기">★</button>
      </div>

      <div class="trigger-box">
        <div class="context-label">📍 새로운 상황 제시</div>
        <div class="context-text" id="contextText">데이터를 불러오는 중입니다...</div>

        <div class="cue-section">
          <div class="cue-label">💬 상대방 대사 (Cue)</div>
          <div class="cue-hidden-note" id="cueHiddenNote">먼저 상황을 떠올려 보고, 아래 버튼을 눌러 상대 대사와 음성을 확인하세요.</div>
          <div class="cue-text" id="cueText">-</div>
          <button class="cue-btn" id="cueActionBtn" onclick="revealAndSpeakCue()">🔊 상대 대사 보기 & 듣기</button>
        </div>
      </div>

      <div class="hint-box" id="hintBox"></div>

      <div class="speak-prompt" id="speakPrompt">
        <strong>🎙️ 상황과 상대 대사를 바탕으로 영어로 반사 발화해 보세요!</strong>
        생각이 안 나면 힌트나 정답을 연 뒤 영화·미드 장면과 함께 소리 내어 따라 해보세요.
      </div>

      <div id="preRevealControls">
        <div class="pre-grid">
          <button class="btn btn-reveal" onclick="revealAnswer()">정답 문장 & 클립 보기</button>
          <button class="btn btn-hint" onclick="showHint()">💡 첫 단어 힌트</button>
        </div>
        <button class="btn btn-reroll" onclick="rerollTrigger()">🎲 새로운 상황 랜덤 뽑기</button>
      </div>

      <div class="answer-box" id="answerBox">
        <div class="answer-english" id="answerEnglish" onclick="this.classList.remove('masked')">-</div>
        <div class="answer-korean" id="answerKorean">-</div>

        <div class="video-actions">
          <button class="btn btn-playphrase" onclick="openScene('playphrase')">🎬 PlayPhrase 영화씬</button>
          <button class="btn btn-yarn" onclick="openScene('yarn')">🎞️ Yarn 미드 클립</button>
        </div>

        <div class="srs-grid">
          <button class="btn btn-again" onclick="rateCard('again')">😅 다시 보기<br><span style="font-size:11px;font-weight:400;">(3문제 뒤 + 내일)</span></button>
          <button class="btn btn-good" onclick="rateCard('good')">✅ 기억남<br><span id="goodLabel" style="font-size:11px;font-weight:400;">(+1일)</span></button>
          <button class="btn btn-easy" onclick="rateCard('easy')">⚡ 아주 쉬움<br><span id="easyLabel" style="font-size:11px;font-weight:400;">(+4일)</span></button>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" onclick="prevItem()">← 이전 카드</button>
      <button class="nav-btn" onclick="speakEnglish(currentItem?.english)">🔊 정답 발음</button>
      <button class="nav-btn" onclick="nextItem()">다음 카드 →</button>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwU58pr4pQPWxYFPPSuQeRMdFObrYg6B6vWt6epazyczJixpkd8eSVUyn4yEdjbW6oC/exec';
    const DAY_MS = 24 * 60 * 60 * 1000;
    const AUDIO_DB_NAME = 'RoleplayAudioCacheDB';
    const AUDIO_STORE_NAME = 'audioFiles';

    let rawPhrases = [];
    let queue = [];
    let currentIndex = 0;
    let currentItem = null;
    let currentTrigger = { context: '', cue: '' };
    let isCueRevealed = false;
    let isRevealed = false;
    let isMasked = false;
    let mode = 'due';
    let currentAudio = null;
    const memoryAudioCache = new Map();

    function cleanQuotes(str) {
      return String(str || '')
        .trim()
        .replace(/^["“'‘]+|["”'’]+$/g, '')
        .trim();
    }

    function todayStr(offsetDays = 0) {
      return new Date(Date.now() + offsetDays * DAY_MS).toISOString().slice(0, 10);
    }

    function openAudioDb() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB not supported'));
          return;
        }
        const req = indexedDB.open(AUDIO_DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(AUDIO_STORE_NAME)) {
            db.createObjectStore(AUDIO_STORE_NAME, { keyPath: 'text' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getCachedAudioDataUrl(text) {
      try {
        const db = await openAudioDb();
        return await new Promise((resolve) => {
          const tx = db.transaction(AUDIO_STORE_NAME, 'readonly');
          const store = tx.objectStore(AUDIO_STORE_NAME);
          const req = store.get(text);
          req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
          req.onerror = () => resolve(null);
        });
      } catch {
        return null;
      }
    }

    async function setCachedAudioDataUrl(text, dataUrl) {
      try {
        const db = await openAudioDb();
        await new Promise((resolve) => {
          const tx = db.transaction(AUDIO_STORE_NAME, 'readwrite');
          const store = tx.objectStore(AUDIO_STORE_NAME);
          store.put({ text, dataUrl, savedAt: Date.now() });
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch {}
    }

    function pcmBase64ToWavDataUrl(base64, sampleRate = 24000) {
      const binary = atob(base64);
      const pcmLen = binary.length;
      const buffer = new ArrayBuffer(44 + pcmLen);
      const view = new DataView(buffer);

      const writeString = (offset, s) => {
        for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + pcmLen, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, pcmLen, true);

      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < pcmLen; i++) bytes[44 + i] = binary.charCodeAt(i);

      let outStr = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        outStr += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return `data:audio/wav;base64,${btoa(outStr)}`;
    }

    function playDataUrl(dataUrl, fallbackText) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = new Audio(dataUrl);
      currentAudio.play().catch(() => fallbackBrowserTTS(fallbackText));
    }

    function fallbackBrowserTTS(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.94;
      const voices = window.speechSynthesis.getVoices() || [];
      const enVoice = voices.find(v => /^en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
      if (enVoice) utter.voice = enVoice;
      window.speechSynthesis.speak(utter);
    }

    async function speakEnglish(rawText) {
      const text = cleanQuotes(rawText);
      if (!text) return;

      if (memoryAudioCache.has(text)) {
        playDataUrl(memoryAudioCache.get(text), text);
        return;
      }

      const idbDataUrl = await getCachedAudioDataUrl(text);
      if (idbDataUrl) {
        memoryAudioCache.set(text, idbDataUrl);
        playDataUrl(idbDataUrl, text);
        return;
      }

      if (!GAS_URL || GAS_URL.includes('여기에_배포된_웹앱_URL')) {
        fallbackBrowserTTS(text);
        return;
      }

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'tts', text })
        });
        const data = await res.json();
        if (data.status === 'ok' && data.audio && data.audio.base64) {
          let dataUrl = '';
          if ((data.audio.mimeType || '').includes('wav')) {
            dataUrl = `data:audio/wav;base64,${data.audio.base64}`;
          } else {
            const rateMatch = /rate=(\d+)/i.exec(data.audio.mimeType || '');
            const rate = rateMatch ? Number(rateMatch[1]) : 24000;
            dataUrl = pcmBase64ToWavDataUrl(data.audio.base64, rate);
          }
          memoryAudioCache.set(text, dataUrl);
          await setCachedAudioDataUrl(text, dataUrl);
          playDataUrl(dataUrl, text);
          return;
        }
      } catch (e) {}

      fallbackBrowserTTS(text);
    }

    function postToSheet(payload) {
      if (!GAS_URL || GAS_URL.includes('여기에_배포된_웹앱_URL')) return;
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    async function init() {
      const ctxEl = document.getElementById('contextText');
      const badgeEl = document.getElementById('statusBadge');
      try {
        if (!GAS_URL || GAS_URL.includes('여기에_배포된_웹앱_URL')) {
          ctxEl.innerText = 'GAS_URL이 설정되지 않았습니다.';
          badgeEl.innerText = 'URL 미설정';
          return;
        }
        const res = await fetch(GAS_URL);
        const text = await res.text();
        const parsed = JSON.parse(text);

        if (!Array.isArray(parsed)) {
          ctxEl.innerText = '응답 형식 오류: ' + text.slice(0, 200);
          badgeEl.innerText = '형식 오류';
          return;
        }

        if (parsed.length === 0) {
          ctxEl.innerText = '시트에 불러올 문장이 없습니다. (시트 탭 이름과 데이터 확인 필요)';
          badgeEl.innerText = '0개';
          return;
        }

        rawPhrases = parsed;
        rebuildQueue();
      } catch (err) {
        ctxEl.innerText = '불러오기 실패: ' + (err && err.message ? err.message : String(err));
        badgeEl.innerText = '오류';
      }
    }

    function setMode(nextMode) {
      mode = nextMode;
      ['fDue', 'fSession15', 'fStar', 'fAll'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
      const map = { due: 'fDue', session15: 'fSession15', star: 'fStar', all: 'fAll' };
      document.getElementById(map[nextMode]).classList.add('active');
      rebuildQueue();
    }

    function toggleMask() {
      isMasked = !isMasked;
      document.getElementById('fMask').classList.toggle('active', isMasked);
      document.getElementById('answerEnglish').classList.toggle('masked', isMasked);
    }

    function isDueToday(item) {
      if (!item.due) return true;
      return item.due <= todayStr(0);
    }

    function rebuildQueue() {
      let list = [...rawPhrases];
      if (mode === 'due') {
        const dueList = list.filter(isDueToday);
        queue = dueList.length > 0 ? dueList : list;
      } else if (mode === 'session15') {
        const dueList = list.filter(isDueToday);
        queue = (dueList.length > 0 ? dueList : list).slice(0, 15);
      } else if (mode === 'star') {
        queue = list.filter(p => p.starred);
      } else {
        queue = list;
      }
      loadCardAt(0);
    }

    function pickRandomTrigger(triggersRaw) {
      if (!triggersRaw) {
        return { context: '자연스러운 일상 대화 상황', cue: "How's it going?" };
      }
      const partsList = String(triggersRaw)
        .split('|')
        .map(s => s.trim())
        .filter(Boolean);
      const chosen = partsList[Math.floor(Math.random() * partsList.length)] || '';
      const [ctx, cue] = chosen.split('::');
      return {
        context: cleanQuotes(ctx) || '일상 대화 상황',
        cue: cleanQuotes(cue)
      };
    }

    function updateSrsPreviewLabels(item) {
      const interval = Number(item.interval) || 0;
      const ease = Number(item.ease) || 2.5;
      const nextGood = interval === 0 ? 1 : interval === 1 ? 3 : Math.round(interval * ease);
      const nextEasy = interval === 0 ? 4 : Math.round(nextGood * 1.3);
      document.getElementById('goodLabel').innerText = `(+${nextGood}일)`;
      document.getElementById('easyLabel').innerText = `(+${nextEasy}일)`;
    }

    function loadCardAt(idx) {
      if (!queue.length) {
        currentItem = null;
        document.getElementById('contextText').innerText = '해당 조건에 맞는 문장이 없습니다.';
        document.getElementById('cueText').innerText = '-';
        document.getElementById('statusBadge').innerText = '0 / 0';
        return;
      }

      currentIndex = ((idx % queue.length) + queue.length) % queue.length;
      currentItem = queue[currentIndex];
      isRevealed = false;

      document.getElementById('answerBox').classList.remove('revealed');
      document.getElementById('preRevealControls').style.display = 'block';
      document.getElementById('speakPrompt').style.display = 'block';
      document.getElementById('hintBox').classList.remove('show');
      document.getElementById('hintBox').innerText = '';

      document.getElementById('statusBadge').innerText =
        `남은 카드 ${queue.length}개 · 누적 ${Number(currentItem.count) || 0}회`;
      document.getElementById('categoryTag').innerText = currentItem.category || '일반';
      document.getElementById('chunkTag').innerText = `청크: ${currentItem.chunk || currentItem.english}`;
      document.getElementById('srsTag').innerText = currentItem.due
        ? `다음 복습: ${currentItem.due} (간격 ${currentItem.interval || 0}일)`
        : 'SRS: 신규';
      document.getElementById('starBtn').classList.toggle('active', Boolean(currentItem.starred));

      document.getElementById('answerEnglish').innerText = currentItem.english;
      document.getElementById('answerEnglish').classList.toggle('masked', isMasked);
      document.getElementById('answerKorean').innerText = currentItem.korean;

      updateSrsPreviewLabels(currentItem);
      rerollTrigger();
    }

    function rerollTrigger() {
      if (!currentItem) return;
      currentTrigger = pickRandomTrigger(currentItem.triggers);
      isCueRevealed = false;

      document.getElementById('contextText').innerText = currentTrigger.context;
      document.getElementById('cueText').innerText =
        currentTrigger.cue ? `"${currentTrigger.cue}"` : '(상황 지문을 보고 반사 발화해 보세요)';
      document.getElementById('cueText').classList.remove('revealed');
      document.getElementById('cueHiddenNote').style.display = 'block';
      document.getElementById('cueActionBtn').innerText = '🔊 상대 대사 보기 & 듣기';
    }

    function revealAndSpeakCue() {
      isCueRevealed = true;
      document.getElementById('cueText').classList.add('revealed');
      document.getElementById('cueHiddenNote').style.display = 'none';
      document.getElementById('cueActionBtn').innerText = '🔊 상대 대사 다시 듣기';
      speakEnglish(currentTrigger.cue);
    }

    function showHint() {
      if (!currentItem) return;
      const words = currentItem.english.split(/\s+/);
      const firstWord = words[0] || '';
      const maskedRest = words.slice(1).map(w => w.replace(/[A-Za-z']/g, '_')).join(' ');
      const hb = document.getElementById('hintBox');
      hb.innerText = `💡 첫 단어 힌트: ${firstWord} ${maskedRest}  |  뜻 힌트: ${currentItem.korean}`;
      hb.classList.add('show');
    }

    function revealAnswer() {
      if (!currentItem) return;
      isRevealed = true;
      document.getElementById('answerBox').classList.add('revealed');
      document.getElementById('preRevealControls').style.display = 'none';
      document.getElementById('speakPrompt').style.display = 'none';
      speakEnglish(currentItem.english);
    }

    function openScene(platform) {
      if (!currentItem) return;
      const query = encodeURIComponent(currentItem.chunk || currentItem.english);
      const url = platform === 'playphrase'
        ? `https://www.playphrase.me/#/search?q=${query}`
        : `https://getyarn.io/yarn-find?text=${query}`;
      window.open(url, 'PhraseSceneWindow', 'width=860,height=660,left=720,top=50');
    }

    function rateCard(rating) {
      if (!currentItem || !queue.length) return;
      let interval = Number(currentItem.interval) || 0;
      let ease = Number(currentItem.ease) || 2.5;

      if (rating === 'again') {
        interval = 1;
        ease = Math.max(1.3, Number((ease - 0.2).toFixed(2)));
        currentItem.interval = interval;
        currentItem.ease = ease;
        currentItem.due = todayStr(1);

        postToSheet({
          action: 'saveSrs',
          rowIndex: currentItem.rowIndex,
          incrementCount: false,
          interval,
          ease,
          due: currentItem.due
        });

        const [card] = queue.splice(currentIndex, 1);
        const insertAt = Math.min(queue.length, 3);
        queue.splice(insertAt, 0, card);
        loadCardAt(currentIndex % Math.max(1, queue.length));
        return;
      }

      if (rating === 'good') {
        interval = interval === 0 ? 1 : interval === 1 ? 3 : Math.round(interval * ease);
      } else if (rating === 'easy') {
        const base = interval === 0 ? 1 : interval === 1 ? 3 : Math.round(interval * ease);
        interval = interval === 0 ? 4 : Math.round(base * 1.3);
        ease = Number((ease + 0.15).toFixed(2));
      }

      currentItem.interval = interval;
      currentItem.ease = ease;
      currentItem.due = todayStr(interval);
      currentItem.count = (Number(currentItem.count) || 0) + 1;

      postToSheet({
        action: 'saveSrs',
        rowIndex: currentItem.rowIndex,
        incrementCount: true,
        interval,
        ease,
        due: currentItem.due
      });

      queue.splice(currentIndex, 1);
      if (queue.length === 0) {
        rebuildQueue();
      } else {
        loadCardAt(currentIndex % queue.length);
      }
    }

    function toggleStar() {
      if (!currentItem) return;
      currentItem.starred = !currentItem.starred;
      document.getElementById('starBtn').classList.toggle('active', currentItem.starred);
      postToSheet({ action: 'toggleStar', rowIndex: currentItem.rowIndex });
    }

    function nextItem() { loadCardAt(currentIndex + 1); }
    function prevItem() { loadCardAt(currentIndex - 1); }

    init();
  </script>
</body>
</html>
